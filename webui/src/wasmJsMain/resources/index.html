<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <title>MT6639 无线控制台</title>
    <style>
      :root {
        --page: #f7f7f7;
        --card: #ffffff;
        --text: #000000;
        --weak: #8c93b0;
        --line: #e8e8e8;
        --primary: #3482ff;
        --on-primary: #ffffff;
        --field: #f0f0f0;
        --error: #b3261e;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --page: #000000;
          --card: #242424;
          --text: #f2f2f2;
          --weak: #787e96;
          --line: #393939;
          --primary: #277af7;
          --on-primary: #ffffff;
          --field: #393939;
          --error: #ffb4ab;
        }
      }
      html, body {
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: var(--page);
        color: var(--text);
        font-family: system-ui, -apple-system, "MiSans", "Noto Sans SC", sans-serif;
        -webkit-tap-highlight-color: transparent;
        overscroll-behavior: none;
      }
      /* Compose owns scrolling inside its canvas. Without this, Chromium can
         claim a vertical pan for the non-scrollable document and cancel the
         pointer stream before LazyColumn receives the drag. Scope it to the
         canvas surface so the native input fallback keeps browser gestures. */
      #composeApp { position: fixed; inset: 0; touch-action: none; }
      #composeApp canvas { touch-action: none; }
      #loading, #fatal {
        position: fixed;
        inset: 0;
        z-index: 10;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--page);
        padding: 24px;
        box-sizing: border-box;
      }
      #loading[hidden], #fatal[hidden] { display: none; }
      .panel { width: 100%; max-width: 360px; text-align: center; }
      .panel h1 { font-size: 20px; font-weight: 600; margin: 0 0 20px; }
      .panel p { font-size: 14px; line-height: 1.6; color: var(--weak); margin: 12px 0 0; }
      .panel code {
        display: block;
        margin-top: 12px;
        padding: 12px;
        border-radius: 12px;
        background: var(--card);
        color: var(--text);
        font-size: 12px;
        text-align: left;
        word-break: break-all;
        white-space: pre-wrap;
      }
      .track { height: 4px; border-radius: 2px; background: var(--line); overflow: hidden; }
      .track div {
        width: 40%;
        height: 100%;
        border-radius: 2px;
        background: var(--primary);
        animation: slide 1.2s ease-in-out infinite;
      }
      @keyframes slide {
        from { transform: translateX(-100%); }
        to { transform: translateX(250%); }
      }
      @media (prefers-reduced-motion: reduce) {
        .track div { animation: none; width: 100%; opacity: 0.5; }
      }
      .mt-veil {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        height: 100%;
        z-index: 20;
        display: flex;
        align-items: flex-end;
        justify-content: center;
        background: rgba(0, 0, 0, 0.4);
        padding: 12px;
        box-sizing: border-box;
      }
      .mt-card {
        width: 100%;
        max-width: 420px;
        max-height: 100%;
        overflow-y: auto;
        overscroll-behavior: contain;
        color: var(--text);
        padding: 24px;
        border-radius: 28px;
        background: var(--card);
        box-sizing: border-box;
      }
      .mt-title { font-size: 19px; font-weight: 600; text-align: center; }
      .mt-hint { margin: 10px 0 18px; font-size: 14px; line-height: 1.5; color: var(--weak); text-align: center; }
      .mt-input {
        width: 100%;
        height: 50px;
        padding: 0 16px;
        border: 0;
        border-radius: 16px;
        outline: none;
        background: var(--field);
        color: var(--text);
        font-size: 17px;
        box-sizing: border-box;
      }
      .mt-input:focus { box-shadow: 0 0 0 2px var(--primary); }
      .mt-validation { min-height: 20px; margin: 8px 4px 12px; color: var(--error); font-size: 13px; }
      .mt-button:disabled { opacity: 0.4; }
      .mt-reveal { display: block; margin: 14px 4px 20px; font-size: 14px; color: var(--weak); }
      .mt-row { display: flex; gap: 20px; }
      .mt-button {
        flex: 1;
        height: 50px;
        border: 0;
        border-radius: 16px;
        background: var(--field);
        color: var(--text);
        font-size: 17px;
        font-weight: 500;
      }
      .mt-primary { background: var(--primary); color: var(--on-primary); }
    </style>
    <script src="bridge.js"></script>
  </head>
  <body>
    <div id="loading">
      <div class="panel">
        <h1>MT6639 无线控制台</h1>
        <div class="track"><div></div></div>
        <p id="loading-text">正在加载…</p>
      </div>
    </div>
    <div id="fatal" hidden>
      <div class="panel">
        <h1>控制台没有加载成功</h1>
        <p>页面需要较新的 Android System WebView（119 或更新，支持 WebAssembly GC）。模块本身不受影响：管理器里的「操作」按钮仍然可以一键开启或关闭 6GHz 热点。</p>
        <code id="fatal-detail"></code>
      </div>
    </div>
    <div id="composeApp"></div>
    <script defer src="console.js"></script>
  </body>
</html>
